<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RyuboStyle Asset Gallery</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #06b6d4;
      --text-color: #f8fafc;
      --text-sub: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
    }
    header {
      text-align: center;
      padding: 24px 0 16px;
      border-bottom: 1px solid #334155;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 8px;
      color: var(--accent-color);
    }
    p.subtitle {
      font-size: 0.875rem;
      color: var(--text-sub);
      margin: 0;
    }
    nav.tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid #334155;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      border-color: var(--accent-color);
    }
    .section-title {
      font-size: 1.2rem;
      margin: 24px 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--accent-color);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #334155;
    }
    .card img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background-color: #000;
    }
    .card audio, .card video {
      width: 100%;
      margin-top: 8px;
    }
    .card-title {
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    .prompt-box {
      background-color: #090d16;
      border-radius: 6px;
      padding: 10px;
      font-size: 0.75rem;
      color: #cbd5e1;
      max-height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <header>
    <h1>RyuboStyle Asset Gallery</h1>
    <p class="subtitle">沖縄の翁 × Gemini-AI嬢 シネマティックアセット一覧</p>
  </header>

  <!-- タブ切り替えボタン -->
  <nav class="tabs">
    <button class="tab-btn active" onclick="showCategory('all')">すべて表示</button>
    <button class="tab-btn" onclick="showCategory('images')">📷 画像 (images)</button>
    <button class="tab-btn" onclick="showCategory('audios')">🎵 音声 (audios)</button>
    <button class="tab-btn" onclick="showCategory('videos')">🎬 動画 (videos)</button>
    <button class="tab-btn" onclick="showCategory('prompts')">📝 プロンプト (prompts)</button>
  </nav>

  <!-- 【1】画像ギャラリー -->
  <div id="cat-images" class="category-block">
    <div class="section-title">📷 画像一覧 (assets/images)</div>
    <div class="grid">
      <div class="card">
        <div class="card-title">Scene 1 Cut 01</div>
        <img src="assets/images/scene1_01_16_9.png" alt="Scene 1 Cut 01" onerror="this.src='https://via.placeholder.com/640x360/1e293b/94a3b8?text=Image+Pending'">
      </div>
      <div class="card">
        <div class="card-title">Scene 1 Cut 02</div>
        <img src="assets/images/scene1_02_16_9.png" alt="Scene 1 Cut 02" onerror="this.src='https://via.placeholder.com/640x360/1e293b/94a3b8?text=Image+Pending'">
      </div>
      <div class="card">
        <div class="card-title">Scene 1 Cut 03</div>
        <img src="assets/images/scene1_03_16_9.png" alt="Scene 1 Cut 03" onerror="this.src='https://via.placeholder.com/640x360/1e293b/94a3b8?text=Image+Pending'">
      </div>
    </div>
  </div>

  <!-- 【2】音声ギャラリー -->
  <div id="cat-audios" class="category-block">
    <div class="section-title">🎵 音声一覧 (assets/audios)</div>
    <div class="grid">
      <div class="card">
        <div class="card-title">Scene 1 ナレーション / 対話</div>
        <audio controls src="assets/audios/scene1.mp3"></audio>
      </div>
      <div class="card">
        <div class="card-title">Scene 2 ナレーション / 対話</div>
        <audio controls src="assets/audios/scene2.mp3"></audio>
      </div>
    </div>
  </div>

  <!-- 【3】動画ギャラリー -->
  <div id="cat-videos" class="category-block">
    <div class="section-title">🎬 動画一覧 (assets/videos)</div>
    <div class="grid">
      <div class="card">
        <div class="card-title">Scene 1 プレビュー動画 (15s)</div>
        <video controls src="assets/videos/scene1.mp4"></video>
      </div>
    </div>
  </div>

  <!-- 【4】プロンプト -->
  <div id="cat-prompts" class="category-block">
    <div class="section-title">📝 プロンプト集 (prompts)</div>
    <p style="font-size: 0.85rem; color: var(--text-sub);">
      詳細な一覧は <a href="README.md" style="color: var(--accent-color);">README.md</a> でもご確認いただけます。
    </p>
  </div>

  <script>
    function showCategory(cat) {
      const blocks = document.querySelectorAll('.category-block');
      const btns = document.querySelectorAll('.tab-btn');
      
      btns.forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      blocks.forEach(b => {
        if (cat === 'all') {
          b.style.display = 'block';
        } else {
          b.id === 'cat-' + cat ? b.style.display = 'block' : b.style.display = 'none';
        }
      });
    }
  </script>

</body>
</html>
